services:
  spacetimedb:
    # Match the Rust SDK and generated bindings; supports amd64 and arm64.
    image: docker.io/clockworklabs/spacetime:v2.1.0
    command: [start, --listen-addr, "0.0.0.0:3000"]
    user: spacetime
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # Mount the existing, user-owned home so a fresh volume is writable
      # by the image's non-root user on Docker and rootless Podman.
      - spacetimedb-home:/home/spacetime
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, "2", "http://127.0.0.1:3000/v1/ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # Ollama web UI — model management, chat, benchmarking
  # http://localhost:8080
  # mac profile: connects to native Ollama on host
  # gpu profile: connects to Ollama container
  open-webui:
    profiles: [mac, gpu]
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - "8080:8080"
    volumes:
      - ./open-webui-data:/app/backend/data
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    restart: unless-stopped

  # Only used on Linux servers with GPU access.
  # On macOS run Ollama natively — Docker cannot access Apple Silicon GPU.
  # Usage: docker compose --profile gpu up
  ollama:
    profiles: [gpu]
    image: docker.io/ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ./ollama-data:/root/.ollama
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  spacetimedb-home:
