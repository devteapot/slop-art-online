[package]
name = "simulation"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bonsai-bt = { version = "0.11", features = ["serde"] }
rhai = { version = "=1.26.0", default-features = false, features = ["std", "no_float", "no_time", "serde"] }

[dependencies.sha2]
version = "0.10"

[features]
schema = ["dep:schemars"]

[dependencies.schemars]
version = "1.2.1"
optional = true
