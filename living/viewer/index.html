<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Living world — observer</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101418}
canvas{display:block;width:100%;height:100%;outline:none}
#loading{position:absolute;left:24px;top:24px;color:#d7e4db;font:15px system-ui;pointer-events:none}
</style>
<link data-trunk rel="rust" data-bin="living-viewer" data-wasm-opt="0">
</head>
<body>
<canvas id="living-canvas" tabindex="0"></canvas>
<div id="loading">Loading the living world observer…</div>
<script>
addEventListener('TrunkApplicationStarted', () => document.getElementById('loading')?.remove());
document.getElementById('living-canvas').addEventListener('contextmenu', e => e.preventDefault());
</script>
</body>
</html>
