[package]
name = "living-game"
version = "0.1.0"
edition = "2021"
description = "Camera and controls spike for the playable client (desktop, 3D). Throwaway; see docs/GAME_BRIEF.md."

[dependencies]
bevy = { version = "=0.20.1", default-features = false, features = ["3d", "ui_bevy_render"] }
bevy_egui = { version = "=0.43.1", default-features = false, features = ["render", "default_fonts"] }
bevy_mod_outline = "=0.14.0"
spacetimedb-sdk = { workspace = true }
living-bindings = { path = "../bindings" }
living-rules = { path = "../rules", default-features = false }
serde_json = { workspace = true }
serde = { workspace = true }
