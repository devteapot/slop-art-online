[package]
name = "living-authority"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# `unstable` (SpacetimeDB 2.14.1) is needed for two things, both to re-test on any SpacetimeDB
# upgrade (docs/LIVING_CORE.md):
# - procedures: `mind_act_checked` and `mind_reach` (living/authority/src/mind.rs) return values to
#   the mind, which a reducer cannot; the 2.14.1 docs mark Rust procedures unstable;
# - row-level security (`client_visibility_filter`) for the cue event tables (frame.rs; docs/TICK_RATE.md).
spacetimedb = { workspace = true, features = ["unstable"] }
log = "0.4"
serde = { workspace = true }
serde_json = { workspace = true }
living-rules = { path = "../rules" }

[build-dependencies]
serde_json = { workspace = true }
