[package]
name = "living-authority"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# `unstable` (SpacetimeDB 2.14.1) is needed for procedures: `mind_act_checked` and `mind_reach`
# (living/authority/src/mind.rs) return values to the mind, which a reducer cannot. The 2.14.1
# docs mark Rust procedures unstable: re-test both on any SpacetimeDB upgrade (docs/LIVING_CORE.md).
spacetimedb = { workspace = true, features = ["unstable"] }
log = "0.4"
serde = { workspace = true }
serde_json = { workspace = true }
living-rules = { path = "../rules" }

[build-dependencies]
serde_json = { workspace = true }
