[package]
name = "living-authority"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# `unstable`: row-level security (`client_visibility_filter`) for the cue event tables (frame.rs).
spacetimedb = { workspace = true, features = ["unstable"] }
log = "0.4"
serde = { workspace = true }
serde_json = { workspace = true }
living-rules = { path = "../rules" }

[build-dependencies]
serde_json = { workspace = true }
