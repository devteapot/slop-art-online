[workspace]
resolver = "2"
members = ["rules", "authority", "bindings", "mind", "viewer", "game"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `internals`: the AST walk that finds the fields each law reads (rules/src/script/fields.rs).
rhai = { version = "=1.27.0", default-features = false, features = ["std", "no_time", "internals"] }
spacetimedb = "=2.14.1"
spacetimedb-sdk = "=2.14.1"

[profile.release]
opt-level = 3

# Fast-to-build browser profile for the viewer (`just living-web`).
[profile.wasm-dev]
inherits = "dev"
opt-level = 1
debug = 0
strip = true

[profile.wasm-dev.package."*"]
opt-level = 2

# The viewer generates its pixel art at startup; keep that fast in the browser build.
[profile.wasm-dev.package.living-viewer]
opt-level = 2
