[package]
name = "lf-guest"
version = "0.1.0"
edition = "2021"
publish = false

# A wasm32-unknown-unknown module with no imports: living-rules' staged land generation, driven
# one step per call by lf-host.
[lib]
crate-type = ["cdylib"]

[dependencies]
living-rules = { path = "../../../rules" }
serde_json = "1"
