[package]
name = "pb-host"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# SpacetimeDB 2.14.1's wasmtime, as living/tools/script_bench/host uses it.
wasmtime = { version = "=39.0.1", default-features = false, features = ["addr2line", "async", "cache", "cranelift", "demangle", "parallel-compilation", "runtime", "std"] }
anyhow = "1"
serde_json = "1"
