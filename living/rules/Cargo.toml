[package]
name = "living-rules"
version = "0.1.0"
edition = "2021"

[features]
default = ["scripting"]
# Rhai skill runtime; the viewer can disable it.
scripting = ["dep:rhai"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
rhai = { workspace = true, optional = true }
# Platform-independent transcendental functions: land generation must be bit-identical in
# the WASM authority and a native client (src/det.rs).
libm = "0.2"
