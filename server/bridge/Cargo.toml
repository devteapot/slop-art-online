[package]
name = "bridge"
default-run = "bridge"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bridge"
path = "src/main.rs"

[dependencies]
spacetimedb-sdk = { version = "=2.1.0" }
shared = { path = "../../shared" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
log = "0.4"
env_logger = "0.11"

simulation = { path = "../../simulation", features = ["schema"] }

axum = "0.8"
rand = "0.9"
