<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAO — Bevy simulation client</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101a20}canvas{display:block;width:100%;height:100%;outline:none}#loading{position:absolute;left:24px;top:24px;color:#d7e4db;font:16px system-ui;pointer-events:none}</style>
<link data-trunk rel="rust" data-bin="client" data-cargo-no-default-features data-cargo-features="foundation,webgl2"></head>
<body><canvas id="sao-canvas" tabindex="0"></canvas><div id="loading">Loading Bevy game client…</div>
<script>window.addEventListener('TrunkApplicationStarted',()=>document.getElementById('loading')?.remove());</script></body></html>
